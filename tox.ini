[tox]
envlist = py{38,39,310,311,312}, lint, type, docs
isolated_build = True

[testenv]
deps =
    pytest>=7.0
    pytest-cov>=4.0
commands =
    pytest {posargs}

[testenv:lint]
deps =
    black
    isort
    flake8
commands =
    black --check src tests
    isort --check-only src tests
    flake8 src tests

[testenv:type]
deps =
    mypy
commands =
    mypy src

[testenv:docs]
deps =
    sphinx
    sphinx-rtd-theme
commands =
    sphinx-build -W -b html docs docs/_build/html
